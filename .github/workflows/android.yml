name: Android build and device tests
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and lint
        run: gradle -p android --no-daemon --max-workers=2 assembleDebug assembleRelease assembleDebugAndroidTest lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell settings put system system_locales zh-CN
            gradle -p android --no-daemon --max-workers=2 connectedDebugAndroidTest
            mkdir -p artifacts/android-screenshots
            adb pull /sdcard/Android/data/lab.flyfishliu031.planreminder/files/screenshots artifacts/android-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-API-${{ matrix.api }}-checks
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
            artifacts/android-screenshots
          if-no-files-found: warn
